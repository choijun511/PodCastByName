<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听谁 · 内容审核</title><link rel="stylesheet" href="style.css"><style>main{max-width:1050px}form{display:grid;grid-template-columns:minmax(0,1fr);width:100%;gap:10px;margin:18px 0}form label{white-space:normal;overflow-wrap:anywhere;font:14px sans-serif;color:var(--ink)}input,textarea,select{width:100%;background:#191919;color:var(--ink);border:1px solid #666;padding:12px;font:16px sans-serif}textarea{min-height:85px}.review{border:1px solid var(--line);padding:24px;margin:20px 0}.review button{margin:10px 10px 0 0}.review h3{font-size:20px}.review p{white-space:pre-wrap;overflow-wrap:anywhere}.admin-error{color:#ffb8ad}#status{min-height:26px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}</style></head><body><aside><a class="brand" href="/"><b>听谁 /</b></a><a href="/">返回收听</a></aside><main><h1>内容审核</h1><p class="sub">导入后由已配置的 AI 自动判断。证据明确的出场自动发布，证据不足暂缓；也保留人工纠错入口。</p><form id="auth"><label for="token">本地管理密钥（启动服务时显示，仅保存在当前页面内存）</label><input type="password" id="token" autocomplete="off" required><button class="primary">连接目录</button></form><p id="status" role="status"></p><div id="workspace" hidden><section class="review"><h2 style="font-size:28px">AI 自动审核</h2><p id="ai-status"></p><p id="ai-runtime" class="sub"></p><p id="ai-budget" class="sub"></p><button id="ai-refresh">刷新处理状态</button><button id="ai-run">唤醒后台队列</button><details><summary>最近判断记录</summary><div id="ai-recent"></div></details></section><section><h2 style="font-size:28px">人物补录请求</h2><p class="sub">按身份线索查找人物并核验出场后，再关联人物并标记完成。</p><div id="requests"></div></section><details><summary>新增人物</summary><form id="person"><label>人物姓名<input name="name" required maxlength="100"></label><label>英文名或别名<input name="alias" maxlength="200"></label><label>主题<input name="topic" required maxlength="60"></label><label>身份说明<input name="role" required maxlength="150"></label><label>简介<textarea name="intro" maxlength="500"></textarea></label><button>保存人物</button></form></details><form id="import"><label for="person-id">为哪位人物查找出场</label><select id="person-id" required></select><label for="feed">公开 RSS 地址</label><input id="feed" type="url" required placeholder="https://…"><button class="primary">导入并查找候选</button></form><section><h2 style="font-size:28px">已接入的 RSS</h2><p class="sub">手动检查来源中的新出场。新增内容进入待核验；重复检查不会重新发布已审核单集。</p><div id="sources"></div></section><div class="row"><h2 style="font-size:28px">出场候选</h2><label>审核状态<select id="filter"><option value="all">全部</option><option value="pending">待核验</option><option value="approved">已发布</option><option value="rejected">已驳回</option></select></label></div><div id="candidates"></div><h2 style="font-size:25px;margin-top:40px">导入记录</h2><div id="runs"></div></div></main><script src="admin.js"></script></body></html>
